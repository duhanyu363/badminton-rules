# Optional nginx reverse proxy for production deployment.
# This lets the static site and native AI Hawkeye API share one host.

server {
    listen 80;
    server_name badminton.example.com;

    root /var/www/badminton-rules;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Native AI Hawkeye API. Long analyses run asynchronously, while SSE
    # streams progress through /api/jobs/<job_id>/events.
    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 1024m;
    }
}
