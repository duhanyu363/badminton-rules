[phases.setup]
nixPkgs = ["python311", "ffmpeg", "git"]
aptPkgs = ["libgl1-mesa-glx", "libglib2.0-0", "libsm6", "libxext6", "libxrender-dev", "libgomp1"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r ai-hawkeye/requirements.txt",
  "python ai-hawkeye/setup_good_badminton.py --download-weights"
]

[start]
cmd = "gunicorn --chdir ai-hawkeye native_api:app --bind 0.0.0.0:${PORT:-5050} --workers 1 --threads 4 --timeout 1800"
