[phases.setup]
nixPkgs = ["python311", "ffmpeg", "git", "libGL", "glib", "libsm", "xorg.libXext", "xorg.libXrender", "libgomp"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r ai-hawkeye/requirements.txt",
  "python ai-hawkeye/setup_good_badminton.py --download-weights"
]

[start]
cmd = "python ai-hawkeye/run_good_badminton.py --host 0.0.0.0 --port ${PORT:-5050}"
