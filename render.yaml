services:
  - type: web
    name: badminton-rules-ai-hawkeye
    env: python
    plan: starter
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r ai-hawkeye/requirements.txt
      python ai-hawkeye/setup_good_badminton.py --download-weights
    startCommand: python ai-hawkeye/run_good_badminton.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_HAWKEYE_MAX_UPLOAD_MB
        value: "1024"
      - key: AI_HAWKEYE_ALLOWED_ORIGINS
        value: https://duhanyu363.github.io
      - key: AI_HAWKEYE_GOOD_ROOT
        value: Good-Badminton
