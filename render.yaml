services:
  - type: web
    name: badminton-rules-ai-hawkeye
    env: python
    plan: starter
    buildCommand: |
      apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 ffmpeg && pip install --upgrade pip && pip install -r ai-hawkeye/requirements.txt
      python ai-hawkeye/setup_good_badminton.py --download-weights
    startCommand: gunicorn --chdir ai-hawkeye native_api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 1800
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_HAWKEYE_MAX_UPLOAD_MB
        value: "1024"
      - key: AI_HAWKEYE_ALLOWED_ORIGINS
        value: https://duhanyu363.github.io
      - key: AI_HAWKEYE_GOOD_ROOT
        value: ai-hawkeye/Good-Badminton
